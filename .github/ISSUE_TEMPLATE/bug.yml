name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Do not attach private files

        A Photos library contains your photo metadata: names of albums and files, dates, places, people. **Do not attach `Photos.sqlite`, a `*.photoslibrary` package, a copy of the database or any file derived from it.** This issue is public and cannot be fully deleted later.

        Describe what you see in your own words, paste only short excerpts, and replace real names, paths, dates and UUIDs with neutral ones (`IMG_0001.HEIC`, `2024/05-01 - Holidays`). If a reproduction needs data, build a small synthetic database instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? If the result differs from osxphotos, say which osxphotos command and version you compared with.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal Go snippet or test that shows the problem, without personal data.
      render: go
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
      description: The version of github.com/Windemiatrix/go-libs/osxphotos from your go.mod, for example osxphotos/v0.1.0.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Photos version
      description: The system that created the library, for example "macOS 15.2, Photos 10.0". Say if you do not know.
  - type: input
    id: go-version
    attributes:
      label: Go version and platform
      description: Output of `go version`.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: Relevant lines only, with private data replaced.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach `Photos.sqlite`, a Photos library or a copy of its database, and I removed personal data from everything I pasted.
          required: true
