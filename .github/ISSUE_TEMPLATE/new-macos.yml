name: New macOS or Photos version
description: The library rejects, or misreads, a library created by a newer macOS or Photos version
title: "feat(schema): macOS "
labels: ["upstream"]
body:
  - type: markdown
    attributes:
      value: |
        Apple changes the structure of the Photos database between macOS versions. The library refuses to guess: for an unknown structure it returns an "unsupported schema" error. To add support, we need to know exactly which version produced the library and what the library reported.

        **Do not attach `Photos.sqlite`, a Photos library or any file derived from it.** They contain your photo metadata. If maintainers need more information, they will ask for specific, non-personal facts, for example the table structure without any rows.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, About This Mac, for example "macOS 27.0 (build number)".
    validations:
      required: true
  - type: input
    id: photos
    attributes:
      label: Photos app version
      description: Photos menu, About Photos.
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
      description: The version of github.com/Windemiatrix/go-libs/osxphotos from your go.mod.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error returned by the library
      description: The full error text. If it contains a model version number, keep it. Remove any names or paths of your own.
      render: text
    validations:
      required: true
  - type: dropdown
    id: upstream-support
    attributes:
      label: Does the current osxphotos support this macOS version?
      options:
        - "Yes"
        - "No"
        - "I do not know"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach a Photos library, `Photos.sqlite` or a copy of its database.
          required: true
