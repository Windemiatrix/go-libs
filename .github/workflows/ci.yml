# A step that also runs locally calls one Makefile target or the action of the
# same tool and version; event values reach it only through env:. "ci-ok" is
# the check the ruleset of main requires.
# Every push to main that touches osxphotos/ is released by the "release" job.
# The tests do not run again on that push: the ruleset of main merges only a
# branch that is up to date with main and green, so main gets exactly the tree
# the PR tested.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      major:
        description: "Release osxphotos/v1.0.0 (the move from 0.x is never made by a PR title)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: Asia/Kolkata

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make pr-title

  linux:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: osxphotos/go.mod
          cache: false
      - name: Modules
        run: make mod
      - name: Vet
        run: make vet
      - name: Tests and coverage
        run: make cover

  macos:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: osxphotos/go.mod
          cache: false
      # The release binary instead of "go run": building golangci-lint from
      # source took most of the job.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Bump together with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          working-directory: osxphotos
          skip-cache: true
      - name: Vet
        run: make vet
      - name: Tests and coverage with cgo
        run: make cover
      - name: Cross-build for amd64
        run: make cross-build

  repo-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: osxphotos/go.mod
          cache: false
      - name: Repository checks
        run: make check-repo
      # shellcheck is preinstalled on the Ubuntu runner.
      - name: Shell scripts
        run: make lint-sh

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The LicenseRef is howett.net/plist: BSD-2-Clause-Views together with
          # BSD-3-Clause, both permissive; GitHub does not map the pair to SPDX ids.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, LicenseRef-scancode-google-patent-license-golang, LicenseRef-bad-bsd-2-clause-views-bsd-3-clause
          comment-summary-in-pr: never

  # Not in ci-ok: a new vulnerability must not turn an unrelated change red.
  govulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: osxphotos/go.mod
          cache: false
      - name: govulncheck
        run: make vuln

  ci-ok:
    if: always()
    needs: [pr-title, linux, macos, repo-checks, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

  # The version comes from the PR titles since the last tag (.svu.yml); the
  # notes are the same titles, grouped like those of photosync (GoReleaser
  # cannot release tags with a prefix without Pro). The GitHub Release creates
  # the tag on the tested commit. No caches: they could be poisoned.
  release:
    needs: [ci-ok]
    # A manual run without "major" is a check (govulncheck), not a release.
    # !cancelled(): without a status function GitHub adds success(), which is
    # false when any job before ci-ok was skipped (pr-title on a push).
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.major))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: osxphotos/go.mod
          cache: false
      - name: govulncheck
        run: make vuln
      - name: Release and Go proxy warm-up
        env:
          BUMP: ${{ inputs.major && 'major' || 'next' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # titles <grep option>...: the PR titles since the last tag that
          # touch the module and match, as a markdown list.
          titles() {
            git log --reverse --format='- %s' "$range" -- osxphotos/ | grep "$@" || true
          }

          # section <heading> <grep option>...
          section() {
            local items
            items="$(titles "${@:2}")"
            if [[ -n "$items" ]]; then
              printf '## %s\n\n%s\n\n' "$1" "$items"
            fi
          }

          last="$(git describe --tags --abbrev=0 --match 'osxphotos/v*' 2>/dev/null || true)"
          range="${last:+$last..}HEAD"
          if [[ -z "$(titles .)" ]]; then
            echo "No changes in osxphotos/ since ${last:-the beginning}: nothing to release"
            exit 0
          fi
          # svu needs a previous tag, so the first release is named here.
          if [[ -n "$last" ]]; then
            tag="$(make -s next-version BUMP="$BUMP")"
          else
            tag=osxphotos/v0.1.0
          fi

          breaking='^- [a-z]+\([^)]*\)!:'
          {
            section "Breaking changes" -E "$breaking"
            section "Features" -E '^- feat\([^)]*\):'
            section "Bug fixes" -E '^- fix\([^)]*\):'
            section "Documentation" -E '^- docs\([^)]*\):'
            section "Other" -vE "$breaking"'|^- (feat|fix|docs)\([^)]*\):'
          } >"$RUNNER_TEMP/notes.md"

          echo "Release $tag"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          GOPROXY=https://proxy.golang.org go list -m "github.com/Windemiatrix/go-libs/osxphotos@${tag#osxphotos/}"
