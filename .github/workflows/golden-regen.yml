# It never pushes and never opens a pull request: "make golden-fetch" downloads
# the artifact of the latest successful run and a person commits it.
name: golden-regen

on:
  workflow_dispatch:

permissions: {}

jobs:
  golden:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install osxphotos
        run: |
          python -m pip install --disable-pip-version-check --no-input -r tools/golden/requirements.txt
          python -m pip freeze --all
      - name: Reference data
        run: bash scripts/golden-build.sh "$RUNNER_TEMP/golden"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden
          path: ${{ runner.temp }}/golden/
          if-no-files-found: error
          retention-days: 30
