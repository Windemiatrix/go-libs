# Reference data for the differential tests of the osxphotos module. Runs
# osxphotos (the version in tools/golden/requirements.txt) on every library of
# testdata/libraries, the synthetic one included, keeps the keys listed in
# testdata/golden/fields.txt and uploads the artifact "golden".
# It never pushes and never opens a pull request: "make golden-fetch RUN=<id>"
# downloads the artifact and a person commits it.
name: golden-regen

on:
  workflow_dispatch:

permissions: {}

jobs:
  golden:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install osxphotos
        run: |
          python -m pip install --disable-pip-version-check --no-input -r tools/golden/requirements.txt
          python -m pip freeze --all
      - name: Reference data
        run: |
          set -euo pipefail

          # A jq filter that keeps only the top-level keys listed in
          # testdata/golden/fields.txt, in the order osxphotos writes them.
          # $f and $k are jq variables, not shell ones.
          # shellcheck disable=SC2016
          listed_fields_only='($f | split("\n") | map(select(test("^[a-z]")))) as $k
            | map(with_entries(select(.key | IN($k[]))))'

          # copy_database <library dir> <package>: a package with nothing but
          # copies of the database and its WAL. It is also the check that
          # osxphotos opens such a package.
          copy_database() {
            local dir="$1" pkg="$2"
            mkdir -p "$pkg/database"
            cp "${dir}database/Photos.sqlite" "$pkg/database/Photos.sqlite"
            if [ -f "${dir}database/Photos.sqlite-wal" ]; then
              cp "${dir}database/Photos.sqlite-wal" "$pkg/database/Photos.sqlite-wal"
            fi
          }

          # write_reference_data <package> <name>: writes
          # golden/<name>/query.json and deleted.json. The raw output of
          # osxphotos has the path of the runner in "library": it stays in
          # RUNNER_TEMP and never reaches the artifact.
          write_reference_data() {
            local pkg="$1" name="$2" out raw photos trashed
            out="$RUNNER_TEMP/golden/$name"
            mkdir -p "$out"
            raw="$(mktemp "$RUNNER_TEMP/raw.XXXXXX")"
            osxphotos query --library "$pkg" --json --mute >"$raw"
            jq --rawfile f testdata/golden/fields.txt "$listed_fields_only" "$raw" >"$out/query.json"
            osxphotos query --library "$pkg" --json --mute --deleted-only >"$raw"
            jq --rawfile f testdata/golden/fields.txt "$listed_fields_only" "$raw" >"$out/deleted.json"
            rm -f "$raw"
            photos="$(jq length "$out/query.json")"
            trashed="$(jq length "$out/deleted.json")"
            echo "$name: $photos photos, $trashed in the trash"
          }

          # The synthetic library is the only one with some states
          # (testdata/libraries/SOURCES.md): a run without it is not a result.
          require_synthetic_library() {
            if ! [ -d "$RUNNER_TEMP/golden/synthetic" ]; then
              echo "error: no synthetic library in testdata/libraries" >&2
              exit 1
            fi
          }

          # -l: on a match the log shows the names of the files, never the data.
          check_no_runner_paths() {
            local grep_status=0 no_match=1
            grep -rlF -e "$RUNNER_TEMP" -e "$HOME" -e "$GITHUB_WORKSPACE" "$RUNNER_TEMP/golden" || grep_status=$?
            if [ "$grep_status" -ne "$no_match" ]; then
              echo "error: grep exited with $grep_status: the files above contain a path of the runner, or the check failed" >&2
              exit 1
            fi
          }

          # The hashes let a person compare the data of a pull request with this
          # log, and two runs with each other.
          print_hashes() {
            local out name file sum
            for out in "$RUNNER_TEMP"/golden/*/; do
              name="$(basename "$out")"
              for file in query.json deleted.json; do
                sum="$(shasum -a 256 "$out$file")"
                echo "sha256 $name/$file ${sum%% *}"
              done
            done
          }

          write_reference_data_of_every_library() {
            local dir name pkg
            for dir in testdata/libraries/*/; do
              [ -f "${dir}database/Photos.sqlite" ] || continue
              name="$(basename "$dir")"
              pkg="$RUNNER_TEMP/libs/$name.photoslibrary"
              copy_database "$dir" "$pkg"
              write_reference_data "$pkg" "$name"
            done
          }

          write_reference_data_of_every_library
          require_synthetic_library
          check_no_runner_paths
          print_hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden
          path: ${{ runner.temp }}/golden/
          if-no-files-found: error
          retention-days: 30
