# Reference data for the differential tests of the osxphotos module. Runs
# osxphotos (the version in tools/golden/requirements.txt) on every library of
# testdata/libraries, the synthetic one included, keeps the keys listed in
# testdata/golden/fields.txt and uploads the artifact "golden".
# It never pushes and never opens a pull request: "make golden-fetch" downloads
# the artifact of the latest successful run and a person commits it.
name: golden-regen

on:
  workflow_dispatch:

permissions: {}

jobs:
  golden:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: UTC
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install osxphotos
        run: |
          python -m pip install --disable-pip-version-check --no-input -r tools/golden/requirements.txt
          python -m pip freeze --all
      - name: Reference data
        run: |
          set -euo pipefail

          # Keeps the top-level keys listed in testdata/golden/fields.txt, in
          # the order osxphotos writes them. $f and $k are jq variables.
          # shellcheck disable=SC2016
          listed_fields='($f | split("\n") | map(select(test("^[a-z]")))) as $k
            | map(with_entries(select(.key | IN($k[]))))'

          # osxphotos finds database/Photos.sqlite in the library directory.
          for lib in testdata/libraries/*/; do
            [ -f "${lib}database/Photos.sqlite" ] || continue
            out="$RUNNER_TEMP/golden/$(basename "$lib")"
            mkdir -p "$out"
            osxphotos query --library "$lib" --json --mute |
              jq --rawfile f testdata/golden/fields.txt "$listed_fields" >"$out/query.json"
            osxphotos query --library "$lib" --json --mute --deleted-only |
              jq --rawfile f testdata/golden/fields.txt "$listed_fields" >"$out/deleted.json"
          done

          # A listed field may hold a path of the runner; -l prints the names
          # of the files, never the data.
          if grep -rlF -e "$RUNNER_TEMP" -e "$HOME" -e "$GITHUB_WORKSPACE" "$RUNNER_TEMP/golden"; then
            echo "error: the files above contain a path of the runner" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden
          path: ${{ runner.temp }}/golden/
          if-no-files-found: error
          retention-days: 30
