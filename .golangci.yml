# The version is pinned in the Makefile (GOLANGCI_LINT_VERSION); CI lints on
# macOS so that darwin-only files are analyzed too. golangci-lint finds this
# file in the parent directory of the module.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - revive
  settings:
    depguard:
      rules:
        # The template language is pure: it renders from values it is given and
        # never touches files, the database or the network.
        template:
          list-mode: lax
          files:
            - "**/osxphotos/template/**"
            - "!$test"
          deny:
            - {pkg: os, desc: "template does no I/O"}
            - {pkg: os/exec, desc: "template does not start processes"}
            - {pkg: io, desc: "template does no I/O; it renders to strings"}
            - {pkg: io/ioutil, desc: "template does no I/O"}
            - {pkg: net, desc: "template does no I/O"}
            - {pkg: net/http, desc: "template does no I/O"}
            - {pkg: database/sql, desc: "template does not read the database"}
            - {pkg: modernc.org/sqlite, desc: "template does not read the database"}
            - {pkg: path/filepath, desc: "template builds slash-separated paths with package path"}
            - {pkg: syscall, desc: "template does not call the system"}
            - {pkg: unsafe, desc: "template does not use unsafe"}
        # The export naming rules are pure as well.
        export:
          list-mode: lax
          files:
            - "**/osxphotos/export/**"
            - "!$test"
          deny:
            - {pkg: os, desc: "export computes names only; it does no I/O"}
            - {pkg: os/exec, desc: "export does not start processes"}
            - {pkg: io/ioutil, desc: "export does no I/O"}
            - {pkg: net, desc: "export does no I/O"}
            - {pkg: net/http, desc: "export does no I/O"}
            - {pkg: database/sql, desc: "export does not read the database"}
            - {pkg: modernc.org/sqlite, desc: "export does not read the database"}
            - {pkg: syscall, desc: "export does not call the system"}
            - {pkg: unsafe, desc: "export does not use unsafe"}
        # Photos, albums, queries and the schema table are plain values and
        # rules: reading the library is the job of photosdb.
        pure:
          list-mode: lax
          files:
            - "**/osxphotos/photoinfo/**"
            - "**/osxphotos/albuminfo/**"
            - "**/osxphotos/query/**"
            - "**/osxphotos/internal/schema/**"
            - "!$test"
          deny:
            - {pkg: os, desc: "this package does no I/O"}
            - {pkg: os/exec, desc: "this package does not start processes"}
            - {pkg: io, desc: "this package does no I/O"}
            - {pkg: io/ioutil, desc: "this package does no I/O"}
            - {pkg: net, desc: "this package does no I/O"}
            - {pkg: net/http, desc: "this package does no I/O"}
            - {pkg: database/sql, desc: "this package does not read the database; photosdb does"}
            - {pkg: modernc.org/sqlite, desc: "this package does not read the database; photosdb does"}
            - {pkg: syscall, desc: "this package does not call the system"}
            - {pkg: unsafe, desc: "this package does not use unsafe"}
            - {pkg: C, desc: "this package does not use cgo"}
        library:
          list-mode: lax
          files:
            - "**/osxphotos/**"
            - "!$test"
          deny:
            - {pkg: net, desc: "the osxphotos library does not use the network"}
            - {pkg: net/http, desc: "the osxphotos library does not use the network"}
            - {pkg: os/exec, desc: "the osxphotos library does not start processes"}
        # Test support is imported only by tests, so its lines count as tests.
        testsupport:
          list-mode: lax
          files:
            - "**"
            - "!$test"
            - "!**/internal/golden/**"
            - "!**/internal/testlib/**"
          deny:
            - {pkg: github.com/Windemiatrix/go-libs/osxphotos/internal/golden, desc: "golden is imported by tests only"}
            - {pkg: github.com/Windemiatrix/go-libs/osxphotos/internal/testlib, desc: "testlib is imported by tests only"}
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "a library does not write to stdout; log through the *slog.Logger passed by the caller"
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: "a library logs only through the *slog.Logger passed by the caller"
        - pattern: ^os\.Exit$
          msg: "a library never exits the process"
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Head|Post|PostForm)$
          msg: "use a dedicated http.Client with timeouts"
    gosec:
      # G402 (TLS), G204 (subprocess) and G304 (file path) are not excluded;
      # a justified //nolint:gosec comment is the only way to silence them.
      excludes: []
    misspell:
      locale: US
    revive:
      rules:
        - name: exported

  exclusions:
    generated: lax
    rules:
      # forbidigo applies to library code, not to command-line helpers and tests.
      - path: (^|/)cmd/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo]
      # Tests read their own fixtures by variable path, encode fixture bytes by
      # hand and shuffle with a seeded, reproducible generator.
      - path: _test\.go$
        linters: [gosec]
        text: G304|G115|G404

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Windemiatrix

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
